<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — трек не найден</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/avatar.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Unbounded:wght@900&display=swap">
  <style>
    :root { --bg: #000; --fg: #fff; --muted: rgba(255, 255, 255, .64); --accent: #d4ff3a; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(circle at 50% 30%, rgba(212, 255, 58, .14), transparent 60%), var(--bg);
      color: var(--fg); font-family: "JetBrains Mono", ui-monospace, monospace; text-align: center;
    }
    img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 0 0 4px #000, 0 0 0 7px var(--accent); }
    .k { margin-top: 28px; color: var(--accent); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin-top: 8px; font-family: "Unbounded", "Arial Black", sans-serif; font-weight: 900; font-size: clamp(4.5rem, 22vw, 10rem); line-height: 1; letter-spacing: -.04em; }
    p { margin-top: 12px; color: var(--muted); font-size: .9375rem; }
    a {
      display: inline-block; margin-top: 28px; padding: 14px 24px; border-radius: 999px;
      background: var(--accent); color: #000; font-weight: 700; text-decoration: none; box-shadow: 0 0 24px rgba(212, 255, 58, .45);
    }
    a:hover { box-shadow: 0 0 36px rgba(212, 255, 58, .7); }
  </style>
</head>
<body>
  <main>
    <img src="/avatar.svg" alt="" width="96" height="96">
    <div class="k">Track not found</div>
    <h1>404</h1>
    <p>Такой страницы нет. Вернитесь на танцпол.</p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
